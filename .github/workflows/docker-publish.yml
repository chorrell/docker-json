name: Docker

on:
  push:
    branches:
      - main

  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  docker:
    permissions:
      contents: read
      packages: write  # push to GHCR with GITHUB_TOKEN
      id-token: write  # sign the provenance attestations
      attestations: write  # store the attestations
    uses: chorrell/workflows/.github/workflows/docker-publish.yml@v1
    with:
      image-name: json
      test-command: docker run -i --rm "$IMAGE" -ag name value < test.json
      test-platforms: '["linux/amd64", "linux/arm64"]'
      # MAJOR_VERSION: keep the build arg and the tag in step (and the Dockerfile ARG default)
      build-args: MAJOR_VERSION=11
      tags: "11"
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
